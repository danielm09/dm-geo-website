name: Build and Publish Image to Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag ${{ secrets.DOCKER_USERNAME }}/dmgeowebsite:latest
      - name: Push image to docker hub
        run: |
          echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker push ${{ secrets.DOCKER_USERNAME }}/dmgeowebsite:latest

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AWSEC2_HOST_DNS }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.AWSEC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/dm-geo-website" # Place it in the home directory
          strip_components: 0 # Ensures it doesn't create extra nested paths
          overwrite: true

  deploy:

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@master
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
        with:
          host: ${{ secrets.AWSEC2_HOST_DNS }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.AWSEC2_SSH_KEY }}
          envs: DOCKER_USER, LETSENCRYPT_EMAIL
          script: |
            cd ~/dm-geo-website
            docker-compose pull
            docker-compose up -d
            docker image prune -f
    
