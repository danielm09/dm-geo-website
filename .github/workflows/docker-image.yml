name: Build and Publish Image to Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag ${{ secrets.DOCKER_USERNAME }}/dmgeowebsite:latest
      - name: Push image to docker hub
        run: |
          echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker push ${{ secrets.DOCKER_USERNAME }}/dmgeowebsite:latest

  deploy:

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@master
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
          REPO_URL: "https://github.com/${{ github.repository }}.git"
        with:
          host: ${{ secrets.AWSEC2_HOST_DNS }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.AWSEC2_SSH_KEY }}
          envs: DOCKER_USER, LETSENCRYPT_EMAIL, REPO_URL
          script: |
            # 1. Navigate to home or create directory
            if [ ! -d "~/dm-geo-website" ]; then
              git clone $REPO_URL ~/dm-geo-website
            fi
            
            cd ~/dm-geo-website
            
            # 2. Pull the latest code changes
            git pull origin main

            # 3. run docker compose
            docker-compose pull
            docker-compose up -d
            docker image prune -f
    
