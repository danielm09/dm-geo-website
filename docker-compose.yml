services:

  init_letsencrypt:
    image: alpine/openssl:3.3.2
    container_name: init-letsencrypt
    hostname: init-letsencrypt
    environment:
      APP_HOST: "dm-geo.com"
    volumes:
      - certbot-etc:/etc/letsencrypt:rw
    networks:
      - frontend_net
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=8M,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    pids_limit: 64
    cpus: 0.25
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        CERT_DIR="/etc/letsencrypt/live/$${APP_HOST}"
        if [ ! -f "$${CERT_DIR}/fullchain.pem" ]; then
          echo "No cert found — creating dummy self-signed cert for first boot..."
          mkdir -p "$${CERT_DIR}"
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout "$${CERT_DIR}/privkey.pem"   \
            -out    "$${CERT_DIR}/fullchain.pem" \
            -subj   "/CN=$${APP_HOST}"
          # Do NOT create chain.pem — certbot manages that file on real issuance.
          echo "Dummy cert created. Certbot will replace it after nginx is healthy."
        else
          echo "Cert already exists — skipping."
        fi
        chmod 755 /etc/letsencrypt /etc/letsencrypt/live 2>/dev/null || true
        chmod 755 "$${CERT_DIR}"
        chmod 644 "$${CERT_DIR}/fullchain.pem" 2>/dev/null || true
        find /etc/letsencrypt -type f -name 'privkey*.pem' -exec chmod 0640 {} + 2>/dev/null || true

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-web-root:/var/www/certbot
    networks:
      - frontend_net
      - other_net
    depends_on:
      dmgeo_website:
        condition: service_healthy
      init_letsencrypt:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 3

  certbot:
    image: certbot/certbot:v3.2.0
    container_name: certbot
    depends_on:
      nginx:
        condition: service_healthy
    init: true
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-web-root:/var/www/certbot
      - ./certbot-deploy-hook.sh:/usr/local/bin/certbot-deploy-hook.sh:ro
    networks:
      - frontend_net
    restart: unless-stopped
    environment:
      APP_HOST: "dm-geo.com"
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL} #or load email from .env file or github secret
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        trap "exit 0" TERM INT

        if [ -d "/etc/letsencrypt/live/$${APP_HOST}" ] && [ ! -f "/etc/letsencrypt/renewal/$${APP_HOST}.conf" ]; then
          echo "[certbot] Removing stale non-certbot lineage for $${APP_HOST}..."
          rm -rf "/etc/letsencrypt/live/$${APP_HOST}" \
                 "/etc/letsencrypt/archive/$${APP_HOST}" \
                 "/etc/letsencrypt/renewal/$${APP_HOST}.conf"
        fi

        # Obtain initial cert (ECDSA P-384). Exponential backoff capped at 30min
        BACKOFF=60
        until certbot certonly \
          --non-interactive --agree-tos --no-eff-email \
          --cert-name     "$${APP_HOST}"             \
          --email         "$${LETSENCRYPT_EMAIL}"      \
          --webroot --webroot-path /var/www/certbot     \
          --key-type ecdsa --elliptic-curve secp384r1  \
          --keep-until-expiring                         \
          --deploy-hook   "sh /usr/local/bin/certbot-deploy-hook.sh" \
          -d              "$${APP_HOST}" \
          -d              "www.$${APP_HOST}"; do
          echo "[certbot] Issuance failed — retrying in $${BACKOFF}s..."
          sleep "$${BACKOFF}" & wait $$!
          BACKOFF=$$(( BACKOFF * 2 ))
          [ "$${BACKOFF}" -gt 1800 ] && BACKOFF=1800
        done

        # Renewal loop: certbot only renews within 30 days of expiry.
        while true; do
          sleep 12h & wait $$!
          echo "[certbot] Running scheduled renewal check..."
          certbot renew \
            --non-interactive \
            --deploy-hook "sh /usr/local/bin/certbot-deploy-hook.sh" || true
        done


  dmgeo_website:
    image: danielmoraes09/dmgeowebsite:latest
    container_name: dmgeo_website
    restart: always
    expose:
      - "8502"
    networks:
      - other_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8502/healthz').read()"] #because the docker image does not have wget or curl to perform the check
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  #geoquery service should be started in its own separate workflow

volumes:
  certbot-etc:
  certbot-var:
  certbot-web-root:

networks:
  frontend_net:
    name: frontend_net
  other_net:
    name: other_net


