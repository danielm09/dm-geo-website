server {
    listen 80;
    server_name dm-geo.com www.dm-geo.com;

    # Healthchecks
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain always;
    }
    
    # Handle ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dm-geo.com www.dm-geo.com;

    # These paths must exist for Nginx to start
    ssl_certificate /etc/letsencrypt/live/dm-geo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dm-geo.com/privkey.pem;

    location / {
        proxy_pass http://dmgeo_website:8502/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Streamlit app at /geoquery
    location /geoquery {
        proxy_pass http://localhost:8501/geoquery;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        #proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }
}